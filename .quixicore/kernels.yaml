schema_version: 0.2
backend: rocm
layout: canonical_arch_variants

status_values:
  - optimized
  - implemented
  - imported
  - experimental
  - planned
  - unsupported
  - capability_gated

variant_path_rule: kernels/<family>/<operation>/variants/rocm_<target>[/<tuned_variant>]

families:
  norms:
    status: implemented
    paths:
      - kernels/norms
      - kernels/norms/rms_norm_residual_next
  activations:
    status: partial
    paths:
      - kernels/activations
  attention:
    status: partial
    paths:
      - kernels/attention
      - kernels/attention/attn_fwd_sg
  linear_attention:
    status: partial
    paths:
      - kernels/linear_attention
  ssm:
    status: partial
    paths:
      - kernels/ssm
  matmul:
    status: implemented
    paths:
      - kernels/matmul
  quantization:
    status: partial
    paths:
      - kernels/quantization
      - kernels/quantization/qgemv_fused
  moe:
    status: partial
    paths:
      - kernels/moe
  sampling:
    status: partial
    paths:
      - kernels/sampling
  serving:
    status: partial
    paths:
      - kernels/serving
      - kernels/serving/mean_pool_rms_l2
  optimizers:
    status: partial
    paths:
      - kernels/optimizers
  conv:
    status: partial
    paths:
      - kernels/conv
  audio:
    status: partial
    paths:
      - kernels/audio
  vision:
    status: partial
    paths:
      - kernels/vision
  collectives:
    status: experimental
    paths:
      - kernels/collectives
      - distributed-kernels
  utils:
    status: partial
    paths:
      - kernels/utils
  pooling:
    status: implemented
    paths:
      - kernels/pooling

operations:
  layernorm:
    family: norms
    status: implemented
    path: kernels/norms/layernorm
    variants:
      - name: rocm_cdna3
        status: imported
        path: kernels/norms/layernorm/variants/rocm_cdna3
      - name: rocm_cdna4
        status: implemented
        path: kernels/norms/layernorm/variants/rocm_cdna4

  rmsnorm:
    family: norms
    status: imported
    path: kernels/norms/rmsnorm
    variants:
      - name: rocm_cdna3
        status: imported
        path: kernels/norms/rmsnorm/variants/rocm_cdna3

  norm_quant:
    family: norms
    status: implemented
    path: kernels/norms/norm_quant
    notes: >-
      RMSNorm quant epilogues, AZP int8, and per-token-group int8 ported from
      CUDA elementwise norm_quant. 8/8 fp64/round-trip checks pass on MI300X;
      block128/block256 fp16 int8 dynamic RMSNorm timings are within noise on
      16384x4096.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/norms/norm_quant/variants/rocm_cdna3

  qk_norm_rope:
    family: norms
    status: implemented
    path: kernels/norms/qk_norm_rope
    notes: >-
      Packed-QKV Q/K RMSNorm + RoPE ported from QuixiCore-Metal for CDNA3.
      Supports D in {64,128,256}, split-half and interleaved RoPE, Gemma
      weight mode, and V copy-through. Standalone HIP harness passes host
      oracle checks on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/norms/qk_norm_rope/variants/rocm_cdna3

  qk_norm_rope_kv_f16:
    family: norms
    status: implemented
    path: kernels/norms/qk_norm_rope
    notes: >-
      Current Metal split-store QK RMSNorm + RoPE contract for bf16 packed QKV:
      Q heads write bf16, K heads write fp16, and V heads copy through to fp16
      in the same pass. Supports D in {64,128,256}, split-half/interleaved RoPE,
      and Gemma weight mode. Standalone CDNA3 harness passes 43 fp64-oracle
      checks and keeps the wave/block row route over a scalar row baseline.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/norms/qk_norm_rope/variants/rocm_cdna3

  softmax:
    family: activations
    status: implemented
    path: kernels/activations/softmax
    variants:
      - name: rocm_cdna3
        status: imported
        path: kernels/activations/softmax/variants/rocm_cdna3
      - name: rocm_cdna4
        status: implemented
        path: kernels/activations/softmax/variants/rocm_cdna4

  elementwise:
    family: activations
    status: optimized
    path: kernels/activations/elementwise
    notes: >-
      Port of QuixiCore-CUDA/kernels/elementwise (rms/layernorm fwd+bwd,
      add_norm +fp8-e4m3 epilogues, softmax, gelu, glu x6, dropout,
      cross_entropy +_mw, embedding +2 bwd +multimodal, hadamard, adamw, add).
      Plain-CUDA tm_* kernels hipified with CDNA3 warp adaptations (mask-free
      __shfl_*). 56/56 fp64-oracle checks pass on MI300X.
    variants:
      - name: rocm_cdna3
        status: imported
        path: kernels/activations/elementwise/variants/rocm_cdna3

  kd_kl_dense_fwd:
    family: utils
    status: implemented
    path: kernels/activations/phase10_training
    notes: >-
      Phase 10 dense knowledge-distillation KL forward route with per-row
      student/teacher logsumexp outputs and temperature-scaled loss.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/activations/phase10_training/variants/rocm_cdna3

  kd_kl_dense_bwd:
    family: utils
    status: implemented
    path: kernels/activations/phase10_training
    notes: >-
      Phase 10 dense KL distillation backward route, computing student-logit
      gradients from dense teacher and student probabilities.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/activations/phase10_training/variants/rocm_cdna3

  kd_kl_topk_fwd:
    family: utils
    status: implemented
    path: kernels/activations/phase10_training
    notes: >-
      Phase 10 top-k KL distillation forward route over sparse teacher logits
      and indices with dense student logsumexp.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/activations/phase10_training/variants/rocm_cdna3

  kd_kl_topk_bwd:
    family: utils
    status: implemented
    path: kernels/activations/phase10_training
    notes: >-
      Phase 10 top-k KL distillation backward route. Each dense student
      position scans top-k corrections, avoiding duplicate-index races.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/activations/phase10_training/variants/rocm_cdna3

  kd_ce_fused_fwd:
    family: utils
    status: implemented
    path: kernels/activations/phase10_training
    notes: >-
      Phase 10 fused cross-entropy plus dense KL distillation forward route,
      returning CE, KD, raw student LSE, temperature student LSE, and teacher
      LSE.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/activations/phase10_training/variants/rocm_cdna3

  kd_ce_fused_bwd:
    family: utils
    status: implemented
    path: kernels/activations/phase10_training
    notes: >-
      Phase 10 fused CE+KD backward route with dense teacher probabilities and
