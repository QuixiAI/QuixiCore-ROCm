      (q4_mfma_up_gate_gelu_f16): dual Q4_0 weight-only MFMA projections (up,
      gate) of one fp16 activation on v_mfma_f32_16x16x16_f16, then
      gelu_tanh(gate)*up in registers before a single fp16 store. Fuses what
      qflux (single proj+gelu+bias) and flux_gate (dense*precomputed gate) do
      not. rel ~3.3e-4 vs fp64; 1.19-1.23x over unfused two-proj+gelu on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/quantization/qgeglu/variants/rocm_cdna3

  gqa_swa:
    family: attention
    status: implemented
    path: kernels/attention/gqa_swa
    notes: >-
      Symmetric (bidirectional, centered) sliding-window GQA flash attention
      ported from embeddinggemma.c (mfma_attention_f16). Query q attends keys
      [q-w/2, q+w/2] with no causal mask; w=0 recovers full attention. Same
      BQ=BK=16 online-softmax MFMA flash as gqa, GQA with H_KV=1. Adds the
      centered band that gqa/gqa_causal (backward-only) could not express. rel
      ~1.4e-4..1.9e-4 vs fp64; T=2048 window=256 is 6.8x over full on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/gqa_swa/variants/rocm_cdna3

  attn_fwd_sg_d256:
    family: attention
    status: implemented
    path: kernels/attention/attn_fwd_sg
    notes: >-
      Current Metal head_dim=256 GQA forward-attention contract: fp32 Q/O,
      fp16 K/V, explicit scale, bidirectional full attention or symmetric
      sliding window, and runtime Hq/Hkv grouping. Standalone CDNA3 harness
      passes 21 fp64-oracle checks over MQA/GQA/MHA and keeps the scratch-free
      block-row online-softmax route over a scalar query/head baseline.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/attn_fwd_sg/variants/rocm_cdna3

  pool_mean_rms_l2:
    family: pooling
    status: implemented
    path: kernels/pooling/pool_mean_rms_l2
    notes: >-
      Sentence-embedding pooling head ported from embeddinggemma.c (pool_kernel):
      per-token RMSNorm with learned gain, then masked mean-pool over the
      sequence, then L2-normalize -- one vector per sequence. RMS is applied per
      token before averaging (matched to the fp64 oracle ei_mean_pool_rms_l2);
      plain w gain ((1+w) folded into the exported weight upstream); eps 1e-6.
      One wave64 owns a sequence's D-vector (D in {256,512,768,1024}), token
      matrix read once, no LDS. Adds the pooling family (previously absent). The
      final_singleton_pool epilogue is intentionally not ported (fails GEMM-shape
      parity, cosine 0.770). rel ~1.5e-7 vs fp64, cosine 1.0; 2.49-2.98x over the
      naive two-pass, ~3.4-4.0 TB/s (near HBM3 roofline) on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/pooling/pool_mean_rms_l2/variants/rocm_cdna3

  mean_pool_rms_l2:
    family: serving
    status: implemented
    path: kernels/serving/mean_pool_rms_l2
    notes: >-
      Current Metal bf16 serving-pool contract: mean-pool the token rows first,
      then apply RMSNorm with a bf16 weight and L2-normalize the weighted vector.
      This is intentionally distinct from pool_mean_rms_l2, whose older
      embeddinggemma contract applies per-token RMSNorm before pooling.
      Standalone CDNA3 harness passes 15 bf16-output fp64-oracle checks and keeps
      a wave64 pooled-vector route over a scalar baseline.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/mean_pool_rms_l2/variants/rocm_cdna3

  qkv_proj_fused:
    family: quantization
    status: implemented
    path: kernels/quantization/qkv_proj_fused
    notes: >-
      Fused combined Q/K/V weight-only Q4_0 projection ported from
      embeddinggemma.c (q4_mfma_qkv_projection_kernel + qkv_mfma_target). One
      launch projects the same fp16 activation through the Q (768), K (256) and
      V (256) Q4_0 weight matrices, sharing one activation fragment over K=768,
      each 16x16 tile accumulated with v_mfma_f32_16x16x16_f16 -- the qgeglu
      up+gate fusion applied to the attention projection, with heterogeneous
      output-row counts. Combined projection only; norm/RoPE deliberately not
      folded (the QKV+norm+RoPE mega-fusion regressed to 0.997-1.008x, coarse
      fusion collapses CDNA3 occupancy). rel ~1.6e-4 vs fp64, fused bit-identical
      to unfused; 2.80x@M32 down to 1.47x@M368 in the native-MFMA band, tapering
      to 1.13x@M1024 as it goes compute-bound, on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/quantization/qkv_proj_fused/variants/rocm_cdna3

  rms_residual_next:
    family: norms
    status: implemented
    path: kernels/norms/rms_residual_next
    notes: >-
      Fused residual-add + double RMSNorm ported from embeddinggemma.c
      (rms_residual_next_f32/f16_cached). One warp per token row computes the
      post-projection RMS, updates the residual stream, then computes the next
      layer's input RMS from the EI_N_EMBD/32=24 residual values held in
      registers between the two norms -- collapsing ~4 norm launches/layer to 2
      with no residual DRAM round-trip. Matches the CPU oracle
      ei_rms_norm_residual_inplace + ei_rms_norm; sibling of the Metal/CUDA/XPU
      rms_residual_next. Register-cache depth shape-locked to EI_N_EMBD/32;
      self-parity ceiling ~0.999997, so validated vs fp64 at tolerance. rel ~4e-8
      (f32) / ~1.8e-4 (f16) vs fp64, cosine 1.0; f32 2.00x@M64 to 1.71x@M2048
      over the separate-launch route on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/norms/rms_residual_next/variants/rocm_cdna3

  rms_norm_residual_next:
    family: norms
    status: implemented
    path: kernels/norms/rms_norm_residual_next
    notes: >-
      Current Metal bf16 residual-stream seam: post-RMSNorm the projection,
      add it to the bf16 residual stream, write bf16 res_out, then pre-RMSNorm
      the unrounded residual value for bf16 next_out. Supports D in
      {256,512,768,1024}. Standalone CDNA3 harness passes 29 bf16-output
      fp64-oracle checks and keeps the wave64 row route over a scalar row
      baseline.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/norms/rms_norm_residual_next/variants/rocm_cdna3

  cross_attention:
    family: attention
    status: implemented
    path: kernels/attention/cross_attention
    notes: >-
      Cross-attention with independent query/key lengths, ported from the CPU
      reference quixicore_cpu::cross_attention. Preserves the full contract:
      per-batch valid key count (clamped, not assumed), optional additive score
      bias, optional score softcap, explicit-or-automatic scale, GQA head
      grouping, D in {64,128,256}, and an all-zero row when a batch item has no
      valid keys. Bias is added to the SCALED score and the softcap is applied
      after the bias -- both orderings are contractual. MFMA-tiled flash
      attention, BQ=BK=16, one wave64 per query block, K/V tile reused across 16
      queries, v_mfma_f32_16x16x16{bf16_1k,f16} for QK^T and P@V, softmax over an
      LDS transpose of S. Unlike the self-attention kernel, Lq and Lk need not be
      multiples of 16: partial query/key tiles are masked, and the first-tile
      running max is special-cased so exp(-inf - -inf) cannot emit NaN on ragged
      input. bf16 and fp16 storage; fp32 storage deliberately not ported (no
      caller, and it would need an MFMA-free path). Forward only. 50/50 PASS vs
      fp64 oracle (rel ~2.2e-3 bf16 / ~2.6e-4 fp16, cosine >0.999997); 2.43x
      (ragged) to 9.31x (D=64 prefill) over a wavefront-per-query baseline,
      30-44 TFLOP/s on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/cross_attention/variants/rocm_cdna3

  biased_attention:
    family: attention
    status: implemented
    path: kernels/attention/biased_attention
    notes: >-
      Additive per-head score bias plus an optional boolean key mask, ported from
      the CPU reference quixicore_cpu::biased_attention. Layout [Hq,Lq,D] with no
      batch dimension. Two contract details differ from cross_attention and are
      pinned by tests: the bias is indexed PER HEAD while the mask is a single
      [Lq,Lk] plane SHARED across heads, and automatic scale triggers on
      scale == 0 (not scale > 0), so a negative explicit scale is legal and
      honoured. A masked key is skipped rather than driven to -inf, so it never
      enters the running max; a tile with no live keys is special-cased because
      exp(-inf - -inf) is NaN. MFMA-tiled flash attention, BQ=BK=16, one wave64
      per (query block, head), shared fragment layout from
      kernels/common/cdna3_mfma.cuh. Includes a masked-tile skip: the wavefront
      OR-reduces the 16x16 mask tile and skips the K/V load plus MFMAs when
      nothing is live -- without it a +-8 banded mask measured 0.70x, an outright
      regression against a baseline that skips masked keys; with it the same
      shape is 3.62x at 87.7 TFLOP/s. bf16 and fp16 storage; D 32/64/128/256
      (32 is the Swin head dim). Forward only; fp32 storage not ported. 50/50
      PASS vs fp64 oracle (rel ~2.1e-3 bf16 / ~2.5e-4 fp16, cosine >0.999997, at
      the one-storage-ULP elementwise bound); 2.90x-5.10x over the
      wavefront-per-query baseline on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/biased_attention/variants/rocm_cdna3

  rope_variants:
    family: attention
    status: implemented
    path: kernels/attention/rope_variants
    notes: >-
      The eight RoPE operations the Metal/CPU manifests publish that ROCm lacked:
      rotary_positioned, mrope, rope_table, rope_interleaved_to_split,
      rope_backward, qk_norm_rope_positioned, qk_norm_rope_split, rope_q_norm.
      Grouped in one operation dir as kernels/serving and kernels/linear_attention
      already are. Split (p, half+p) and interleaved (2p, 2p+1) pair layouts are
      both supported and never conflated; mrope and rope_q_norm are split-only by
      contract; rope_interleaved_to_split converts layout as part of the rotation;
      rope_backward applies the transpose (rotation by -theta), not the forward
      with swapped operands. A rotary_dim < head_dim leaves the tail unrotated --
      copied through for the plain variants, normalized+weighted but unrotated for
      the qk_norm variants -- and every rotary_dim-taking variant has a partial
      case. qk_norm variants RMS over the FULL head_dim (not rotary_dim), apply
      norm+weight BEFORE rotation, and copy V heads through; weight_offset carries
      Gemma's (1+w) convention. fp32/bf16/fp16 storage. 78/78 PASS vs fp64
      (fp32 rel ~2.5e-8, cosine 1.0). Perf: pow->exp2+sincos KEEP (1.68x
      interleaved_to_split, 1.57x rope_backward, both were transcendental-bound);
      32->64 lanes/row REJECTED on all eight (0.82-0.96x) because these pack
      rows-per-block so a 32-lane row already fills the wavefront -- the norm
      widening win does not transfer. Ships at 32 lanes/row, 3.3-4.0 TB/s
      (~75% of HBM3 peak) on MI300X.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/rope_variants/variants/rocm_cdna3

  attn_composites:
    family: attention
    status: implemented
    path: kernels/attention/attn_composites
    notes: >-
      Composite attention shapes ported from the CPU references:
      swin_attention_d32, decode_cache_attention, cascade_attention_multi.
      Grouped in one operation dir as kernels/serving already is. Swin takes
      token-interleaved packed QKV ((pos*3 + which)*heads + head), fixed D=32, the
      reference's hardcoded 0.1767766952966369 scale, per-head relative bias, and
      a mask indexed by window %% windows_per_image -- the shifted-window mask
      repeats per image, so the raw window index would mis-shift every window past
      the first image. decode_cache_attention is two dependent stages: RoPE +
      optional K-norm + cache append at slot context_lengths[item], then attention
      over slots [0, context] INCLUSIVE, so the just-appended token is visible to
      the same call; that cross-workgroup dependency forces a launch boundary.
      cascade_attention_multi runs ONE online softmax across N prefix levels (via
      a device pointer array) and then the paged tail, in contract order, so the
      two cannot be computed independently without a merge step; levels=0 is legal.
      fp32. 24/24 PASS vs fp64 (rel ~1e-7 to 6e-7, cosine 1.0), including the
      mutated key cache. Perf: decode 44.64x and cascade 32.02x over scalar
      transliteration baselines (the decode baseline also recomputes the query
      rotation per key, so that figure conflates two effects; cascade's is a clean
      scalar-vs-wavefront result); Swin LDS K/V staging only 1.04x because a
      window's K/V is ~12 KB and already cache-resident.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/attn_composites/variants/rocm_cdna3

  decode_cache_attention:
    family: attention
    status: implemented
    path: kernels/attention/attn_composites
    notes: >-
      Metal manifest alias for the landed Phase 1 decode-cache attention
      composite. The ROCm harness verifies both the RoPE/cache append stage and
      the attention output, including inclusive context visibility of the newly
      appended token.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/attention/attn_composites/variants/rocm_cdna3

  attn_decode_bh:
    family: attention
    status: implemented
    path: kernels/serving/variants
    notes: >-
      Metal manifest alias for the landed ROCm batched decode attention surface:
      q (B,Hq,D), K/V cache (B,Hkv,T,D), context length, and GQA head mapping are
      covered by the serving paged-attention harness with a dense block table.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/variants/rocm_cdna3

  kv_cache_q8_0:
    family: serving
    status: implemented
    path: kernels/serving/kv_cache_q8_0
    notes: >-
      Q8_0 paged KV-cache codec ported from the CPU reference attention_q8_kv.cpp:
      kv_cache_scatter_q8_0, kv_cache_gather_q8_0, kv_cache_copy_blocks_q8_0,
      paged_attention_q8_0. Canonical layout is TWO SEPARATE PLANES -- int8 codes
      [slots, heads, head_dim] and raw fp16-bit scales [slots, heads, head_dim/32]
      -- not the GGUF interleaved block; packing a scale ahead of each 32-code run
      yields plausible numbers and a cache no sibling can read. Quantization is
      scale = amax/127 with code = clamp(copysign(floor(|v/scale|+0.5), v), -127,
      127): round-half-AWAY-from-zero, not rintf's half-to-even, which is why the
      code planes compare bit-exact. amax==0 stores scale 0 / codes 0 rather than
      dividing by zero. Scatter REWRITES THE WHOLE CACHE (zero-fill then write;
      slot -1 skipped and left zeroed) -- the test pre-dirties with 0x7f so a
      missing zero-fill fails. A negative block id is a hole: zeroed on gather,
      skipped entirely in attention (not a zero score). The decode softmax is
      TILED over 32 keys with one rescale per tile, not per-key online, and is
      reproduced exactly so the backends stay comparable; sliding window is
      first = window>0 ? max(0, context-window) : 0. Query stays fp32. 28/28 PASS
      (codes/scales/copy bit-exact; attention rel ~1.5e-7, cosine 1.0) across
      D 64/128/256, page 16/32, MQA and GQA, holes, all-zero groups, window, and
      explicit scale. 6.91x over a scalar transliteration on MI300X, both sides
      doing identical arithmetic.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/kv_cache_q8_0/variants/rocm_cdna3

  kv_cache_scatter_bitnet_kv3:
    family: serving
    status: implemented
    path: kernels/serving/phase2_quant_decode
    notes: >-
      Phase 2 BitNet-KV3 cache scatter port preserving low-bit-first 3-bit
      packing, signed/unsigned codes, none/integer zero-point modes, FP16/FP32
      scale storage, and CPU-order duplicate slot resolution.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/phase2_quant_decode/variants/rocm_cdna3

  kv_cache_gather_bitnet_kv3:
    family: serving
    status: implemented
    path: kernels/serving/phase2_quant_decode
    notes: >-
      Phase 2 BitNet-KV3 cache gather/dequant route sharing the canonical
      3-bit codec and scale/zero metadata interpretation with the scatter path.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/phase2_quant_decode/variants/rocm_cdna3

  paged_attention_bitnet_kv3:
    family: serving
    status: implemented
    path: kernels/serving/phase2_quant_decode
    notes: >-
      Phase 2 BitNet-KV3 paged decode attention over canonical packed K/V cache
      rows, GQA head mapping, tile-16 online softmax, sliding window, and
      FP16/FP32 scale metadata.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/phase2_quant_decode/variants/rocm_cdna3

  paged_attention_turboquant:
    family: serving
    status: implemented
    path: kernels/serving/phase2_quant_decode
    notes: >-
      Phase 2 TurboQuant paged decode attention preserving packed canonical K,
      rotated V, per-32 scale metadata, centroid decode, and the final inverse
      signed FWHT.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/phase2_quant_decode/variants/rocm_cdna3

  paged_attention_advanced:
    family: serving
    status: implemented
    path: kernels/serving/phase2_quant_decode
    notes: >-
      Phase 2 advanced paged attention route with optional block masks, ALiBi
      slopes, sink logits, softcap, sliding window, and GQA head mapping.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/phase2_quant_decode/variants/rocm_cdna3

  quantized_attention:
    family: serving
    status: implemented
    path: kernels/serving/phase2_quant_decode
    notes: >-
      Phase 2 quantized prefill attention over GGUF q8_0 and q4_0 packed rows,
      with full and causal modes. Broader GGUF format dispatch remains a
      follow-up beyond this parity close-out.
    variants:
      - name: rocm_cdna3
        status: implemented
        path: kernels/serving/phase2_quant_decode/variants/rocm_cdna3

notes:
  - Normal build and test discovery must filter by `variants/rocm_<target>` and skip archive directories.
  - Upstream architecture branches are import sources only; supported target variants live side by side in main.
  - CUDA-to-CDNA3 parity status is tracked in `docs/cuda-to-cdna3-port-status.md`.
  - Metal/CPU parity status is tracked in `docs/metal-cpu-parity-gaps.md`.
